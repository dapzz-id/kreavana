name: Kreavana DEV

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_flutter:
        description: 'Build & deploy Flutter Web (frontend)'
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Jangan batalkan run yang sedang berjalan agar build dapat selesai sampai tuntas
  # dan tidak memunculkan status 'Cancelled' saat ada commit baru yang masuk berurutan.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-update:
    name: Build & Update Kreavana DEV
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # ============================================================
      # 1B. DETECT FRONTEND CHANGES (skip Flutter build jika hanya backend/users_api berubah)
      # ============================================================
      - name: Detect Frontend Changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.build_flutter }}" = "false" ]; then
              echo "build_flutter=false" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: Flutter Web build skipped."
            else
              echo "build_flutter=true" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: Flutter Web build enabled."
            fi
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -q '^frontend/'; then
              echo "build_flutter=true" >> "$GITHUB_OUTPUT"
              echo "Frontend changes detected -> will build Flutter Web."
            else
              echo "build_flutter=false" >> "$GITHUB_OUTPUT"
              echo "No frontend changes -> skipping Flutter Web build."
            fi
          else
            echo "build_flutter=true" >> "$GITHUB_OUTPUT"
            echo "Fallback -> will build Flutter Web."
          fi

      # ============================================================
      # 2. SETUP FLUTTER (hanya jika frontend berubah)
      # ============================================================
      - name: Setup Flutter
        if: steps.changes.outputs.build_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        if: steps.changes.outputs.build_flutter == 'true'
        run: flutter --version

      # ============================================================
      # 3. FLUTTER PUB GET
      # ============================================================
      - name: Flutter pub get
        if: steps.changes.outputs.build_flutter == 'true'
        working-directory: frontend
        run: flutter pub get

      # ============================================================
      # 4. BUILD FLUTTER WEB - STAGING
      # ============================================================
      - name: Build Flutter Web Staging
        if: steps.changes.outputs.build_flutter == 'true'
        working-directory: frontend
        run: |
          flutter build web \
            --release \
            --dart-define=ENV=staging \
            --no-wasm-dry-run

      # ============================================================
      # 5. UPDATE KREVANA DEV VPS
      #
      # SSH AGENT + SSH + SCP BERADA DALAM SATU STEP
      # memakai RUNNER_TEMP agar tidak menyentuh ~/.ssh milik host runner.
      # ============================================================
      - name: Update Krevana DEV VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KREAVANA_DEV_CI_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.KREAVANA_DEV_CI_PASSPHRASE }}
          GIT_SSH_PASSPHRASE: ${{ secrets.KREAVANA_DEV_GIT_PASSPHRASE }}
          VPS_HOST: ${{ secrets.KREAVANA_DEV_VPS_HOST }}
          VPS_PORT: ${{ secrets.KREAVANA_DEV_VPS_PORT }}
          VPS_USER: ${{ secrets.KREAVANA_DEV_VPS_USER }}
          KNOWN_HOSTS_ENTRY: ${{ secrets.KREAVANA_DEV_KNOWN_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
          BUILD_FLUTTER: ${{ steps.changes.outputs.build_flutter }}

        run: |
          set -euo pipefail

          TEMP_DIR="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$TEMP_DIR"
          KEY_FILE=$(mktemp "$TEMP_DIR/kreavana_dev_ci.XXXXXX")
          KNOWN_HOSTS_FILE=$(mktemp "$TEMP_DIR/known_hosts.XXXXXX")
          LOCAL_ASKPASS=$(mktemp "$TEMP_DIR/local_askpass.XXXXXX")

          cleanup_local_ssh() {
            rm -f "$KEY_FILE" "$KNOWN_HOSTS_FILE" "$LOCAL_ASKPASS" || true
            [ -n "${SSH_AGENT_PID:-}" ] && ssh-agent -k >/dev/null 2>&1 || true
          }
          trap cleanup_local_ssh EXIT

          echo "============================================================"
          echo "PREPARING EPHEMERAL SSH (SELF-HOSTED SAFE)"
          echo "============================================================"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          printf '%s\n' "$KNOWN_HOSTS_ENTRY" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

          eval "$(ssh-agent -s)" >/dev/null

          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            cat > "$LOCAL_ASKPASS" <<'LOCAL_ASKPASS_EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          LOCAL_ASKPASS_EOF
            chmod 700 "$LOCAL_ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$LOCAL_ASKPASS" SSH_ASKPASS_REQUIRE=force \
              ssh-add "$KEY_FILE" </dev/null >/dev/null
            rm -f "$LOCAL_ASKPASS"
          else
            ssh-add "$KEY_FILE" </dev/null >/dev/null
          fi
          rm -f "$KEY_FILE"

          echo "SSH key loaded successfully into ephemeral ssh-agent."
          ssh-add -l -E sha256

          SSH_OPTS=(
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
          )

          echo "============================================================"
          echo "TEST SSH CONNECTION"
          echo "============================================================"

          ssh "${SSH_OPTS[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "echo 'SSH_AUTH_OK'"

          echo "============================================================"
          echo "UPDATE DEV SOURCE CODE"
          echo "============================================================"

          {
            printf 'GIT_SSH_PASSPHRASE_B64=%q\n' "$(printf '%s' "${GIT_SSH_PASSPHRASE:-}" | base64 | tr -d '\r\n')"
            cat <<'REMOTE_SCRIPT'

          set -euo pipefail

          PROJECT="/var/www/kreavana-dev"
          BACKEND="$PROJECT/backend"
          ASKPASS_FILE=""

          cleanup_git_ssh_agent() {
              [ -n "${ASKPASS_FILE:-}" ] && rm -f "$ASKPASS_FILE" || true
              [ -n "${SSH_AGENT_PID:-}" ] && ssh-agent -k >/dev/null 2>&1 || true
          }
          trap cleanup_git_ssh_agent EXIT

          # Unlock encrypted GitHub deploy key (/root/.ssh/kreavana_dev) in ephemeral RAM ssh-agent
          if [ -n "${GIT_SSH_PASSPHRASE_B64:-}" ] && [ -f /root/.ssh/kreavana_dev ]; then
              eval "$(ssh-agent -s)" >/dev/null
              ASKPASS_FILE=$(mktemp /dev/shm/git_askpass.XXXXXX)
              chmod 700 "$ASKPASS_FILE"
              cat > "$ASKPASS_FILE" <<'ASKPASS_EOF'
          #!/bin/sh
          printf '%s\n' "$GIT_SSH_PASSPHRASE_B64" | base64 -d
          ASKPASS_EOF
              export GIT_SSH_PASSPHRASE_B64
              DISPLAY=:0 SSH_ASKPASS="$ASKPASS_FILE" SSH_ASKPASS_REQUIRE=force \
                ssh-add /root/.ssh/kreavana_dev </dev/null >/dev/null
              rm -f "$ASKPASS_FILE"
              ASKPASS_FILE=""
              unset GIT_SSH_PASSPHRASE_B64
              echo "Encrypted deploy key unlocked in temporary ssh-agent."
          fi

          echo "Project: $PROJECT"
          echo "Target commit: $DEPLOY_SHA"

          cd "$PROJECT"
          git config --global --add safe.directory "$PROJECT"

          echo "Current commit: $(git rev-parse HEAD || true)"
          git fetch --prune origin main

          if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              git fetch origin "$DEPLOY_SHA"
          fi

          if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              echo "ERROR: Deploy commit $DEPLOY_SHA could not be found."
              exit 1
          fi

          git reset --hard "$DEPLOY_SHA"

          if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ]; then
              echo "ERROR: Deployed commit does not match workflow commit."
              exit 1
          fi

          echo "Commit verification OK: $(git rev-parse HEAD)"

          echo "============================================================"
          echo "UPDATE LARAVEL DEPENDENCIES (BACKEND)"
          echo "============================================================"

          cd "$BACKEND"

          COMPOSER_ALLOW_SUPERUSER=1 php8.4 /usr/bin/composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

          php8.4 artisan migrate --force
          php8.4 artisan optimize:clear
          php8.4 artisan config:cache
          php8.4 artisan route:cache
          php8.4 artisan view:cache
          php8.4 artisan queue:restart || true
          php8.4 artisan --version

          echo "DEV backend update completed."

          # ============================================================
          # UPDATE KREAVANA DEV AUTH (USERS_API)
          # ============================================================
          AUTH_PROJECT="/var/www/kreavana-dev-auth"
          AUTH_API="$AUTH_PROJECT/users_api"

          if [ -d "$AUTH_PROJECT" ]; then
              echo "============================================================"
              echo "UPDATING USERS_API IN $AUTH_PROJECT"
              echo "============================================================"
              cd "$AUTH_PROJECT"
              git config --global --add safe.directory "$AUTH_PROJECT"

              git fetch origin main
              git reset --hard origin/main

              cd "$AUTH_API"

              COMPOSER_ALLOW_SUPERUSER=1 php8.4 /usr/bin/composer install \
                --no-interaction \
                --prefer-dist \
                --optimize-autoloader

              php8.4 artisan migrate --seed --force
              php8.4 artisan optimize:clear
              php8.4 artisan config:cache
              php8.4 artisan route:cache

              chown -R www-data:www-data "$AUTH_PROJECT"
              echo "Kreavana DEV Auth (users_api) update completed."
          fi

          REMOTE_SCRIPT
          } | ssh "${SSH_OPTS[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s"

          if [ "${BUILD_FLUTTER}" = "true" ]; then
            echo "============================================================"
            echo "UPLOAD & UPDATE FLUTTER WEB"
            echo "============================================================"

            ssh "${SSH_OPTS[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "rm -rf /var/www/kreavana-dev-build && mkdir -p /var/www/kreavana-dev-build"

            scp "${SSH_OPTS[@]}" -P "$VPS_PORT" -r frontend/build/web/. \
              "$VPS_USER@$VPS_HOST:/var/www/kreavana-dev-build/"

            ssh "${SSH_OPTS[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "rm -rf /var/www/kreavana-dev/frontend/build/web && \
               mkdir -p /var/www/kreavana-dev/frontend/build/web && \
               cp -a /var/www/kreavana-dev-build/. /var/www/kreavana-dev/frontend/build/web/ && \
               test -f /var/www/kreavana-dev/frontend/build/web/index.html && \
               echo 'Kreavana DEV Web update OK'"
          else
            echo "Flutter Web build/upload skipped (no frontend/ changes)."
          fi

          echo "============================================================"
          echo "VERIFY DEV SOURCE COMMIT"
          echo "============================================================"

          ssh "${SSH_OPTS[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd /var/www/kreavana-dev && \
             echo 'DEPLOYED COMMIT:' && git rev-parse HEAD && \
             echo 'DEPLOYED BRANCH:' && git branch --show-current && \
             echo 'GIT STATUS:' && git status --short --branch"

          echo "============================================================"
          echo "KREVANA DEV UPDATE COMPLETED"
          echo "============================================================"
