name: Kreavana DEV

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_flutter:
        description: 'Build & deploy Flutter Web (frontend)'
        type: boolean
        required: false
        default: true
      flutter_runner:
        description: 'Runner untuk Flutter Web (auto mengikuti repo variable FLUTTER_RUNNER)'
        type: choice
        required: false
        default: auto
        options:
          - auto
          - self-hosted
          - ubuntu-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Jangan batalkan run yang sedang berjalan agar build dapat selesai sampai tuntas
  # dan tidak memunculkan status 'Cancelled' saat ada commit baru yang masuk berurutan.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ============================================================
  # JOB 1: DEPLOY BACKEND & USERS_API (24/7 DI VPS, 0 KUOTA GITHUB)
  # ============================================================
  deploy-backend:
    name: Deploy Backend & Users API (VPS 24/7)
    runs-on: [self-hosted, vps-backend]
    defaults:
      run:
        shell: bash
    outputs:
      build_flutter: ${{ steps.changes.outputs.build_flutter }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect Frontend Changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.build_flutter }}" = "false" ]; then
              echo "build_flutter=false" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: Flutter Web build skipped."
            else
              echo "build_flutter=true" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: Flutter Web build enabled."
            fi
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -q '^frontend/'; then
              echo "build_flutter=true" >> "$GITHUB_OUTPUT"
              echo "Frontend changes detected -> will trigger Flutter Web job."
            else
              echo "build_flutter=false" >> "$GITHUB_OUTPUT"
              echo "No frontend changes -> Flutter Web job will be skipped."
            fi
          else
            echo "build_flutter=true" >> "$GITHUB_OUTPUT"
            echo "Fallback -> will trigger Flutter Web job."
          fi

      - name: Deploy Backend & Users API on VPS
        env:
          GIT_SSH_PASSPHRASE: ${{ secrets.KREAVANA_DEV_GIT_PASSPHRASE }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "DEPLOY KREAVANA DEV BACKEND & USERS_API (LOCAL VPS 24/7)"
          echo "============================================================"
          GIT_PASS_B64=$(printf '%s' "${GIT_SSH_PASSPHRASE:-}" | tr -d '\r\n' | base64 | tr -d '\r\n')
          printf '%s\n' "$GIT_PASS_B64" | sudo -n /usr/local/sbin/ci-deploy-kreavana-dev-backend.sh "$DEPLOY_SHA"
          unset GIT_PASS_B64
          echo "============================================================"
          echo "BACKEND & USERS_API DEPLOY COMPLETED"
          echo "============================================================"

  # ============================================================
  # JOB 2: BUILD & UPLOAD FLUTTER WEB (HANYA JIKA frontend/ BERUBAH)
  # Switchable via GitHub Repo Variable FLUTTER_RUNNER:
  # - kosong / self-hosted -> [self-hosted, flutter-builder] (PC lokal)
  # - ubuntu-latest        -> GitHub Cloud (saat kuota bulanan tersedia)
  # ============================================================
  deploy-frontend:
    name: Build & Deploy Flutter Web
    needs: deploy-backend
    if: needs.deploy-backend.outputs.build_flutter == 'true'
    runs-on: ${{ fromJSON((github.event.inputs.flutter_runner == 'ubuntu-latest' || (github.event.inputs.flutter_runner != 'self-hosted' && vars.FLUTTER_RUNNER == 'ubuntu-latest')) && '"ubuntu-latest"' || '["self-hosted", "flutter-builder"]') }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get

      - name: Build Flutter Web Staging
        working-directory: frontend
        run: |
          flutter build web \
            --release \
            --dart-define=ENV=staging \
            --no-wasm-dry-run

      - name: Upload & Update Flutter Web on VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KREAVANA_DEV_CI_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.KREAVANA_DEV_CI_PASSPHRASE }}
          VPS_HOST: ${{ secrets.KREAVANA_DEV_VPS_HOST }}
          VPS_PORT: ${{ secrets.KREAVANA_DEV_VPS_PORT }}
          VPS_USER: ${{ secrets.KREAVANA_DEV_VPS_USER }}
          KNOWN_HOSTS_ENTRY: ${{ secrets.KREAVANA_DEV_KNOWN_HOST }}
        run: |
          set -euo pipefail

          TEMP_DIR="${RUNNER_TEMP:-/tmp}"
          if command -v cygpath >/dev/null 2>&1; then
            TEMP_DIR=$(cygpath -u "$TEMP_DIR")
          fi
          mkdir -p "$TEMP_DIR"
          KEY_FILE=$(mktemp "$TEMP_DIR/kreavana_dev_ci.XXXXXX")
          KNOWN_HOSTS_FILE=$(mktemp "$TEMP_DIR/known_hosts.XXXXXX")

          cleanup_local_ssh() {
            rm -f "$KEY_FILE" "$KNOWN_HOSTS_FILE" || true
            [ -n "${SSH_AGENT_PID:-}" ] && ssh-agent -k >/dev/null 2>&1 || true
          }
          trap cleanup_local_ssh EXIT

          echo "============================================================"
          echo "PREPARING EPHEMERAL SSH FOR FLUTTER WEB UPLOAD"
          echo "============================================================"

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          printf '%s\n' "$KNOWN_HOSTS_ENTRY" | tr -d '\r' > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\r\n')
          VPS_PORT=$(printf '%s' "$VPS_PORT" | tr -d '\r\n')
          VPS_USER=$(printf '%s' "$VPS_USER" | tr -d '\r\n')

          eval "$(ssh-agent -s)" >/dev/null

          # Decrypt ephemeral copy in-place (works identically on Windows Git Bash & Linux)
          CLEAN_SSH_PASSPHRASE=$(printf '%s' "${SSH_PASSPHRASE:-}" | tr -d '\r\n')
          if [ -n "$CLEAN_SSH_PASSPHRASE" ]; then
            if ! ssh-keygen -q -p -P "$CLEAN_SSH_PASSPHRASE" -N "" -f "$KEY_FILE"; then
              echo "ERROR: Gagal mendekripsi KREAVANA_DEV_CI_PRIVATE_KEY."
              echo "Pastikan secret KREAVANA_DEV_CI_PASSPHRASE cocok dengan KREAVANA_DEV_CI_PRIVATE_KEY."
              exit 1
            fi
          fi
          unset CLEAN_SSH_PASSPHRASE
          ssh-add "$KEY_FILE" </dev/null >/dev/null
          rm -f "$KEY_FILE"

          echo "SSH key loaded successfully into ephemeral ssh-agent."
          ssh-add -l -E sha256

          SSH_OPTS=(
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
          )

          echo "============================================================"
          echo "UPLOAD & UPDATE FLUTTER WEB"
          echo "============================================================"

          ssh "${SSH_OPTS[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "rm -rf /var/www/kreavana-dev-build && mkdir -p /var/www/kreavana-dev-build"

          scp "${SSH_OPTS[@]}" -P "$VPS_PORT" -r frontend/build/web/. \
            "$VPS_USER@$VPS_HOST:/var/www/kreavana-dev-build/"

          ssh "${SSH_OPTS[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "rm -rf /var/www/kreavana-dev/frontend/build/web && \
             mkdir -p /var/www/kreavana-dev/frontend/build/web && \
             cp -a /var/www/kreavana-dev-build/. /var/www/kreavana-dev/frontend/build/web/ && \
             test -f /var/www/kreavana-dev/frontend/build/web/index.html && \
             echo 'Kreavana DEV Web update OK'"

          echo "============================================================"
          echo "FLUTTER WEB DEPLOY COMPLETED"
          echo "============================================================"
