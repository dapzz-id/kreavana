name: Kreavana DEV

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-update:
    name: Build & Update Kreavana DEV
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ============================================================
      # 3. FLUTTER PUB GET
      # ============================================================
      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get

      # ============================================================
      # 4. BUILD FLUTTER WEB - DEVELOPMENT
      # ============================================================
      - name: Build Flutter Web DEV
        working-directory: frontend
        run: |
          flutter build web \
            --release \
            --dart-define=ENV=development \
            --no-wasm-dry-run

      # ============================================================
      # 5. UPDATE KREVANA DEV VPS
      #
      # SSH AGENT + SSH + SCP BERADA DALAM SATU STEP
      # sehingga SSH_AUTH_SOCK tetap tersedia.
      # ============================================================
      - name: Update Krevana DEV VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KREAVANA_DEV_CI_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.KREAVANA_DEV_CI_PASSPHRASE }}
          VPS_HOST: ${{ secrets.KREAVANA_DEV_VPS_HOST }}
          VPS_PORT: ${{ secrets.KREAVANA_DEV_VPS_PORT }}
          VPS_USER: ${{ secrets.KREAVANA_DEV_VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail

          echo "============================================================"
          echo "PREPARING SSH"
          echo "============================================================"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kreavana_dev_ci
          chmod 600 ~/.ssh/kreavana_dev_ci

          echo "Starting SSH agent..."

          eval "$(ssh-agent -s)"

          echo "Loading DEV CI SSH key..."

          printf '%s\n' "$SSH_PASSPHRASE" | \
            ssh-add ~/.ssh/kreavana_dev_ci

          echo "SSH key loaded successfully."

          echo "============================================================"
          echo "VERIFY SSH KEY"
          echo "============================================================"

          ssh-add -l -E sha256

          echo "Expected fingerprint:"
          echo "SHA256:vuY9P5qkaMQrGrR2KieMA7Vz0Y+6LNX9chlVuXteQR8"

          echo "============================================================"
          echo "PREPARING KNOWN HOSTS"
          echo "============================================================"

          ssh-keyscan \
            -p "$VPS_PORT" \
            "$VPS_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "============================================================"
          echo "TEST SSH CONNECTION"
          echo "============================================================"

          ssh \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "echo 'SSH_AUTH_OK'"

          echo "============================================================"
          echo "UPDATE DEV SOURCE CODE"
          echo "============================================================"

          ssh \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          PROJECT="/var/www/kreavana-dev"
          BACKEND="$PROJECT/backend"

          echo "Project: $PROJECT"
          echo "Target commit: $DEPLOY_SHA"

          cd "$PROJECT"

          echo "============================================================"
          echo "CONFIGURE GIT SAFE DIRECTORY"
          echo "============================================================"

          git config --global --add safe.directory "$PROJECT"

          echo "Git safe directory configured."

          echo "============================================================"
          echo "CURRENT DEV COMMIT"
          echo "============================================================"

          git rev-parse HEAD || true

          echo "============================================================"
          echo "FETCH ORIGIN MAIN"
          echo "============================================================"

          git fetch --prune origin main

          echo "Origin main:"
          git rev-parse origin/main

          echo "============================================================"
          echo "VERIFY DEPLOY COMMIT"
          echo "============================================================"

          if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              echo "Deploy commit is not available locally."
              echo "Fetching target commit from origin..."

              git fetch origin "$DEPLOY_SHA"
          fi

          if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              echo "ERROR: Deploy commit $DEPLOY_SHA could not be found."
              exit 1
          fi

          echo "Deploy commit exists."

          echo "============================================================"
          echo "UPDATE DEV SOURCE"
          echo "============================================================"

          git reset --hard "$DEPLOY_SHA"

          echo "DEV source updated."

          echo "Updated commit:"
          git rev-parse HEAD

          echo "Expected commit:"
          echo "$DEPLOY_SHA"

          if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ]; then
              echo "ERROR: Deployed commit does not match workflow commit."
              exit 1
          fi

          echo "Commit verification OK."

          echo "============================================================"
          echo "GIT REMOTE"
          echo "============================================================"

          git remote -v | head -2

          echo "============================================================"
          echo "GIT STATUS"
          echo "============================================================"

          git status --short --branch

          echo "============================================================"
          echo "UPDATE LARAVEL DEPENDENCIES"
          echo "============================================================"

          cd "$BACKEND"

          php8.4 /usr/bin/composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

          echo "Composer install completed."

          echo "============================================================"
          echo "CLEAR LARAVEL CACHE"
          echo "============================================================"

          php8.4 artisan optimize:clear

          echo "Laravel cache cleared."

          echo "============================================================"
          echo "REBUILD LARAVEL OPTIMIZED CACHE"
          echo "============================================================"

          php8.4 artisan config:cache
          php8.4 artisan route:cache
          php8.4 artisan view:cache

          echo "Laravel caches rebuilt."

          echo "============================================================"
          echo "RESTART QUEUE WORKERS"
          echo "============================================================"

          php8.4 artisan queue:restart || true

          echo "Queue restart signal sent."

          echo "============================================================"
          echo "VERIFY LARAVEL"
          echo "============================================================"

          php8.4 artisan --version

          echo "DEV backend update completed."

          REMOTE_SCRIPT

          echo "============================================================"
          echo "PREPARE TEMPORARY FLUTTER BUILD DIRECTORY"
          echo "============================================================"

          ssh \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "rm -rf /var/www/kreavana-dev-build && \
             mkdir -p /var/www/kreavana-dev-build"

          echo "Temporary directory prepared."

          echo "============================================================"
          echo "UPLOAD FLUTTER WEB"
          echo "============================================================"

          scp \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -P "$VPS_PORT" \
            -r frontend/build/web/. \
            "$VPS_USER@$VPS_HOST:/var/www/kreavana-dev-build/"

          echo "Flutter Web uploaded successfully."

          echo "============================================================"
          echo "UPDATE DEV WEB"
          echo "============================================================"

          ssh \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "rm -rf /var/www/kreavana-dev/frontend/build/web && \
             mkdir -p /var/www/kreavana-dev/frontend/build/web && \
             cp -a /var/www/kreavana-dev-build/. \
             /var/www/kreavana-dev/frontend/build/web/"

          echo "DEV Web files updated."

          echo "============================================================"
          echo "VERIFY DEV WEB"
          echo "============================================================"

          ssh \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "test -f /var/www/kreavana-dev/frontend/build/web/index.html && \
             echo 'Krevana DEV Web update OK'"

          echo "============================================================"
          echo "VERIFY DEV SOURCE COMMIT"
          echo "============================================================"

          ssh \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "cd /var/www/kreavana-dev && \
             echo 'DEPLOYED COMMIT:' && \
             git rev-parse HEAD && \
             echo 'DEPLOYED BRANCH:' && \
             git branch --show-current && \
             echo 'GIT STATUS:' && \
             git status --short --branch"

          echo "============================================================"
          echo "KREVANA DEV UPDATE COMPLETED"
          echo "============================================================"