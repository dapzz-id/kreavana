# Coturn TURN Server Configuration for Kreavana

# Listening IP (listen on all interfaces inside container)
listening-ip=0.0.0.0

# Listening port
listening-port=3478

# Relay ports range (dipersempit agar port mapping Docker tidak terlalu banyak)
min-port=49152
max-port=49200

# Use fingerprint in TURN message
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Static user credentials — WAJIB ganti di production dengan secret kuat / use-auth-secret
user=kreavana:CHANGE_ME_STRONG_TURN_PASSWORD

# Realm
realm=kreavana.local

# Log to stdout (Docker logs)
log-file=stdout

# No TLS untuk development (aktifkan TLS/DTLS di production)
no-tls
no-dtls

# Disable CLI
no-cli

# Security Hardening: block SSRF to localhost, private RFC1918 networks, and cloud metadata IPs
no-loopback-peers
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# Relay IP (inside container, bind relay sockets to all interfaces)
relay-ip=0.0.0.0

# External IP = IP server Anda (set sesuai lingkungan deployment)
external-ip=10.199.225.224

# Prevent relay bandwidth abuse
user-quota=10
total-quota=100
